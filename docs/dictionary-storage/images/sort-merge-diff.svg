<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <title>정렬-병합 비교</title>
  <rect width="760" height="380" fill="#ffffff"/>

  <g font-size="14" font-weight="700" fill="#1c2434" text-anchor="middle">
    <text x="130" y="34">이전 버전 (정렬됨)</text>
    <text x="380" y="34">새 버전 (정렬됨)</text>
    <text x="630" y="34">판정</text>
  </g>

  <!-- 줄 구분 -->
  <g stroke="#e2e5ea" stroke-width="1">
    <line x1="20" y1="100" x2="740" y2="100"/>
    <line x1="20" y1="156" x2="740" y2="156"/>
    <line x1="20" y1="212" x2="740" y2="212"/>
    <line x1="20" y1="268" x2="740" y2="268"/>
  </g>

  <!-- 1행: 같음 -->
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="54" width="200" height="36" rx="6" fill="#eceef2" stroke="#9aa2b1"/>
    <text x="130" y="77" fill="#1c2434">맨투맨 = 스웨트셔츠</text>
    <rect x="280" y="54" width="200" height="36" rx="6" fill="#fdf3d7" stroke="#c98a12"/>
    <text x="380" y="77" fill="#1c2434">맨투맨 = 스웨트셔츠, 크루넥</text>
    <rect x="540" y="54" width="180" height="36" rx="6" fill="#fdf3d7" stroke="#c98a12"/>
    <text x="630" y="72" fill="#6b4500" font-weight="700">수정</text>
    <text x="630" y="86" fill="#6b4500" font-size="11">키 같음, 값 다름</text>
  </g>

  <!-- 2행: 새 버전에만 -->
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="110" width="200" height="36" rx="6" fill="#ffffff" stroke="#c9ced6" stroke-dasharray="5 4"/>
    <text x="130" y="133" fill="#9aa2b1">(없음)</text>
    <rect x="280" y="110" width="200" height="36" rx="6" fill="#e3f5ec" stroke="#1e8e5a"/>
    <text x="380" y="133" fill="#1c2434">슬랙스 = 정장바지</text>
    <rect x="540" y="110" width="180" height="36" rx="6" fill="#e3f5ec" stroke="#1e8e5a"/>
    <text x="630" y="128" fill="#12613c" font-weight="700">추가</text>
    <text x="630" y="142" fill="#12613c" font-size="11">새 버전의 키가 더 앞섬</text>
  </g>

  <!-- 3행: 이전 버전에만 -->
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="166" width="200" height="36" rx="6" fill="#fdecec" stroke="#d25353"/>
    <text x="130" y="189" fill="#1c2434">운동화 = 스니커즈</text>
    <rect x="280" y="166" width="200" height="36" rx="6" fill="#ffffff" stroke="#c9ced6" stroke-dasharray="5 4"/>
    <text x="380" y="189" fill="#9aa2b1">(없음)</text>
    <rect x="540" y="166" width="180" height="36" rx="6" fill="#fdecec" stroke="#d25353"/>
    <text x="630" y="184" fill="#a32f2f" font-weight="700">삭제</text>
    <text x="630" y="198" fill="#a32f2f" font-size="11">이전 버전의 키가 더 앞섬</text>
  </g>

  <!-- 4행: 동일 -->
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="222" width="200" height="36" rx="6" fill="#eceef2" stroke="#9aa2b1"/>
    <text x="130" y="245" fill="#1c2434">후드티 = 후디</text>
    <rect x="280" y="222" width="200" height="36" rx="6" fill="#eceef2" stroke="#9aa2b1"/>
    <text x="380" y="245" fill="#1c2434">후드티 = 후디</text>
    <rect x="540" y="222" width="180" height="36" rx="6" fill="#f4f5f7" stroke="#c9ced6"/>
    <text x="630" y="240" fill="#5b6475" font-weight="700">변경 없음</text>
    <text x="630" y="254" fill="#5b6475" font-size="11">키와 값이 모두 같음</text>
  </g>

  <!-- 포인터 -->
  <g stroke="#3b6fd4" stroke-width="2" fill="none">
    <line x1="130" y1="286" x2="130" y2="330"/>
    <path d="M123 322 L130 332 L137 322"/>
    <line x1="380" y1="286" x2="380" y2="330"/>
    <path d="M373 322 L380 332 L387 322"/>
  </g>
  <g font-size="13" fill="#1f3f8a" text-anchor="middle">
    <text x="130" y="354" font-weight="700">포인터 A</text>
    <text x="380" y="354" font-weight="700">포인터 B</text>
    <text x="630" y="318" fill="#1c2434">두 포인터는 앞으로만 이동</text>
    <text x="630" y="338" fill="#1c2434">메모리에는 현재 줄 두 개만 유지</text>
  </g>
</svg>
